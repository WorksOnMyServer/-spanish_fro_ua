#version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: spanish_learning_db
    mem_limit: 256m
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Europe/Kyiv
    # Економія RAM: ~410 МБ -> ~110 МБ (performance_schema сам по собі ~200+ МБ)
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=32M
      - --innodb-log-buffer-size=4M
      - --innodb-redo-log-capacity=33554432
      - --max-connections=20
      - --table-open-cache=128
      - --table-definition-cache=400
      - --key-buffer-size=1M
      - --thread-cache-size=4
      - --tmp-table-size=8M
      - --max-heap-table-size=8M
      - --disable-log-bin
      - --skip-name-resolve
      - --host-cache-size=0
    volumes:
      - prod_mysql_data:/var/lib/mysql
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spanish_learning_app
    mem_limit: 300m
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Europe/Kyiv
    env_file:
      - .env
    volumes:
      - .:/app
    command: python main.py
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prod_mysql_data:
    driver: local
